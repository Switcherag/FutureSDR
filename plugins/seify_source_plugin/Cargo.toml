[package]
name = "seify_source_plugin"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["dylib"]

[dependencies]
plugin_api = { path = "../../crates/plugin_api" }
futuresdr = { path = "../../", features = ["plugin", "seify"] }

[features]
default = []
soapy = ["futuresdr/soapy"]
hackrf = ["futuresdr/hackrf"]
rtlsdr = ["futuresdr/rtlsdr"]
aaronia_http = ["futuresdr/aaronia_http"]
