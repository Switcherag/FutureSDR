[package]
name = "seify_sink_plugin"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["dylib"]

[dependencies]
plugin_api = { path = "../../crates/plugin_api" }
# `workspace = true` and NOT an inline feature list: the root
# [workspace.dependencies] entry is the single ABI contract (plugin + seify +
# soapy). Declaring features here re-resolves futuresdr with a different
# feature set, which changes cargo's metadata hash and silently produces a
# plugin that cannot interoperate with the deployed libfuturesdr.so.
futuresdr = { workspace = true }

[features]
# Mirrors seify_source_plugin: without a device backend the seify Builder has
# no driver to monomorphise and the .so links to a ~12 kB stub.
default = ["soapy"]
soapy = ["futuresdr/soapy"]
hackrf = ["futuresdr/hackrf"]
rtlsdr = ["futuresdr/rtlsdr"]
aaronia_http = ["futuresdr/aaronia_http"]
