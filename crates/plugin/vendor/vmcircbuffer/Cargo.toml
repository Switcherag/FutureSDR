# vmcircbuffer 0.0.15 (https://github.com/futuresdr/vmcircbuffer), with a pool
# of double mappings: see src/double_mapped_buffer/unix.rs and PATCHED.md.
[package]
name = "vmcircbuffer"
version = "0.0.15"
authors = ["Bastian Bloessl <mail@bastibl.net>"]
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
homepage = "https://www.futuresdr.org"
repository = "https://github.com/futuresdr/vmcircbuffer/"
readme = "README.md"
description = "Double Mapped Circular Buffer"

[features]
default = []
async = ["futures", "generic"]
sync = ["generic"]
nonblocking = ["generic"]
generic = []
lockfree = []

[dependencies]
futures = { version = "0.3", optional = true }
once_cell = "1.21"
slab = "0.4"
spin = "0.10"
thiserror = "2.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["sysinfoapi", "winbase", "handleapi", "memoryapi"] }

# Standalone: not part of the FutureSDR workspace above.
[workspace]
