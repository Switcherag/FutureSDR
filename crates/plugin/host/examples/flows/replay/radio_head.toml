# A front end that receivers can retune: the radio plugin's SeifySource,
# offering the settings receivers ask for in their [radio] sections. The
# dummy driver produces nothing useful; use e.g. args = "soapy=bladerf"
# with an SDK built with the `soapy` feature.
name = "radio"
plugins = []

[blocks.src]
type = "SeifySource"
args = "driver=dummy"
frequency = 919.0e6
sample_rate = 4e6
gain = 30

[outputs]
samples = { port = "src.outputs[0]", type = "c32" }

[controls]
frequency = "src.freq"
sample_rate = "src.sample_rate"
gain = "src.gain"
