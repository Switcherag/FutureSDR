[package]
name = "futuresdr-plugin-rt"
description = "The shared library FutureSDR plugins and their hosts link: FutureSDR and the plugin API, compiled once."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "futuresdr_plugin_rt"
crate-type = ["dylib"]

[dependencies]
futuresdr.workspace = true
futuresdr-plugin-api.workspace = true

[package.metadata.cargo-machete]
# Used under its library name, `plugin_api`.
ignored = ["futuresdr-plugin-api"]
