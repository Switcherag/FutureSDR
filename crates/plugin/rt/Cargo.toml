[package]
name = "futuresdr-plugin-rt"
description = "The shared library FutureSDR plugins and their hosts link: FutureSDR and the plugin API, compiled once."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "futuresdr_plugin_rt"
crate-type = ["dylib"]

[dependencies]
futuresdr.workspace = true
futuresdr-plugin-api.workspace = true
rustfft.workspace = true
vmcircbuffer = "0.0.15"

[features]
default = ["radio"]
# FutureSDR's seify blocks, with the dummy driver (about 0.2 MB).
radio = ["futuresdr/seify", "futuresdr/seify_dummy"]
# Hardware through SoapySDR, which must be installed. An SDK packed from a
# library built with it builds plugins that use it.
soapy = ["radio", "futuresdr/soapy"]

[package.metadata.cargo-machete]
# Used under its library name, `plugin_api`.
ignored = ["futuresdr-plugin-api"]
