[package]
name = "fsdr-blocks-radio"
description = "SDR front ends through seify, as a plugin."
version = "0.8.0"
edition = "2024"
license = "Apache-2.0"

# No dependencies: `futuresdr_plugin_rt` is provided by the SDK that builds
# this crate (`fsdr-plugin build --sdk <dir> .`), which needs the `radio`
# feature (the default).
[lib]
crate-type = ["dylib"]

[workspace]

[profile.release]
codegen-units = 1
strip = "symbols"
