# 802.11ah (S1G) listen PHY "A" — CSV-logging variant of `halow_listen1.toml`.
#
# Same staged v2 pipeline at 4 MSps direct (the head already delivers 4 MSps):
#   head → StfDetector → CfoCorrector → StoCorrector → ChannelEstimator →
#          SigDecoder → DataDemod → Decoder
#
# Difference vs `halow_listen1.toml`: no `blob_to_udp_plugin` egress. The
# RFTAP-wrapped frames go to a controller tap instead, so the `halow_switch`
# binary can timestamp them and append them to a CSV. `decoder.rx_frames` is
# NOT tapped — the RFTAP tap is the single per-frame event, which keeps one
# frame == one tap message == one CSV row.
#
# The tap name (`rftap_a`) is what identifies this flow in the log, so it must
# stay distinct from flow B's.

[radio]
frequency_hz   = 918.4e6   # 802.11ah S1G — EU upper-900 band 917.4–919.4 MHz (center)
sample_rate_hz = 4e6       # satisfied by the head's resampler (passthrough @ 4 MSps)
gain_db        = 10.0

[[ports]]
id = "in"
direction = "in"
dst = "stf.input"
type = "c32"
from = "head"          # auto-wired to the registered radio head's output

# ── Blocks ──────────────────────────────────────────────────────────

[[blocks]]
id = "stf"
plugin = "wlan_ah_v2_stf_detector_plugin"

[[blocks]]
id = "cfo"
plugin = "wlan_ah_v2_cfo_corrector_plugin"

[[blocks]]
id = "sto"
plugin = "wlan_ah_v2_sto_corrector_plugin"

[[blocks]]
id = "ch"
plugin = "wlan_ah_v2_channel_estimator_plugin"
config = false
config_type = "bool"

[[blocks]]
id = "sig"
plugin = "wlan_ah_v2_sig_decoder_plugin"
config = false
config_type = "bool"

[[blocks]]
id = "data"
plugin = "wlan_ah_v2_data_demod_plugin"
config = false
config_type = "bool"

[[blocks]]
id = "decoder"
plugin = "wlan_ah_decoder_plugin"

# ── Stream connections ──────────────────────────────────────────────

[[connections]]
src = "data.output"
dst = "decoder.input"

# ── Message connections ─────────────────────────────────────────────

[[connections]]
src = "stf.frame"
dst = "cfo.frame"
message = true

[[connections]]
src = "cfo.frame"
dst = "sto.frame"
message = true

[[connections]]
src = "sto.frame"
dst = "ch.frame"
message = true

[[connections]]
src = "ch.frame"
dst = "sig.frame"
message = true

[[connections]]
src = "sig.frame"
dst = "data.frame"
message = true

# ── Controller tap: RFTAP blob per decoded frame ────────────────────
# `halow_switch` writes one CSV row per tap and then swaps to flow B.

[[controller_taps]]
src = "decoder.rftap"
name = "rftap_a"
