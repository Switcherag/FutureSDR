# Chain flow — [auto bridge] -> Copy -> PrintSink("Chain")

[[ports]]
id = "in"
direction = "in"
dst = "passthrough.input"
type = "u8"

[[blocks]]
id = "passthrough"
plugin = "copy_plugin"

[[blocks]]
id = "sink"
plugin = "print_sink_plugin"
config = "Chain"

[[connections]]
src = "passthrough.output"
dst = "sink.input"
