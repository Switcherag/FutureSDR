[package]
name = "real-device-swap-example"
version = "0.1.0"
edition = "2021"
build = "../../plugin_build.rs"

[[bin]]
name = "real_device_swap"
path = "src/main.rs"

[[bin]]
name = "per_frame_swap"
path = "src/per_frame_swap.rs"

[[bin]]
name = "zigbee_swap_offline"
path = "src/zigbee_swap.rs"

# Same swap machinery as zigbee_swap, for the SHORT on-air format: a 21-byte
# PSDU carrying a 1-byte sequence number and the IFS as a u32, instead of the
# 19-byte multizig stamp.
[[bin]]
name = "zigbee_swap_short"
path = "src/zigbee_swap_short.rs"

# Dual-PHY sibling: swaps 802.15.4 @ 2.425 GHz <-> 802.11ah @ 919 MHz on every
# frame, so each swap retunes across bands. Z frames carry the multizig stamp;
# H frames are RPG random payload, where only length and timing are meaningful.
[[bin]]
name = "ziglow_swap"
path = "src/ziglow_swap.rs"

# Sibling of zigbee_swap on the 802.11ah receivers: alternates halow_rxA/rxB
# on every decoded frame. Both flows share a center frequency, so the swap's
# retune is skipped and the hardware is never in the loop.
[[bin]]
name = "halow_swap"
path = "src/halow_swap.rs"

# Per-frame swap driven by libbladeRF quick tune instead of SoapySDR. Owns the
# radio directly (SoapySDR's USB claim blocks a second libbladeRF handle) and
# feeds the flowgraph through connect_radio.
[[bin]]
name = "zigbee_swap_quicktune"
path = "src/zigbee_swap_quicktune.rs"
required-features = ["quicktune"]

[[bin]]
name = "phy_per"
path = "src/phy_per.rs"

[[bin]]
name = "receiver"
path = "src/receiver.rs"

[dependencies]
futuresdr = { workspace = true }
plugin_host = { path = "../../crates/plugin_host" }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
# Direct libbladeRF bindings, for quick tune. Optional so an ordinary workspace
# build never compiles bindgen or needs libbladeRF present; enable with
# `--features quicktune`.
bladerf = { path = "../freq_swap/bladerfbindings/seify-bladerf", optional = true }

[features]
# On by default, deliberately. The plugin ABI depends on the *shape of the
# resolve*, not just on feature flags, so a feature that is sometimes on and
# sometimes off yields two incompatible libfuturesdr.so builds and silently
# invalidates every plugin whenever you switch. One configuration, one ABI:
# `build.sh` then builds the whole ecosystem in a single invocation as before.
#
# The cost is that libbladeRF must be installed to build this example. Turn it
# off with `--no-default-features` on a machine without it — but then rebuild
# the plugins in the same invocation.
default = ["quicktune"]
# Pulls in libbladeRF for the quick-tune binary.
quicktune = ["dep:bladerf"]
