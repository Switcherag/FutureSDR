# HaLow receiver (802.11ah, S1G 2 MHz at 4 MSps) in one block,
# WlanReceiver<Ah>, as wlan_single.toml.
#
# The data symbols are Viterbi decoded (WlanDecoder / WlanReceiver, which
# carry the Viterbi decoder alone).
#
# The radio bench swaps it with halow_single_hard.toml
# after every frame: the whole flowgraph is replaced at each swap.
#
# The frames whose FCS is wrong are posted too, whole (`invalid_frames`):
# the radio bench's transmitter sends minimum-size frames with no
# payload, so there is no FCS here to check.
name = "halow/single/viterbi"

[blocks.rx]
type = "WlanReceiver<Ah>"
invalid_frames = true

[inputs]
samples = { port = "rx.input", type = "c32" }

[message_outputs]
frames = "rx.rx_frames"

# S1G channel 34 (EU), 2 MHz, as the dyn branch's real-device runs.
[radio]
frequency = 919.0e6
