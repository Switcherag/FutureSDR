# 802.11ah (HaLow, S1G 2 MHz at 4 MSps) receiver in one block: the wlan
# plugin's WlanReceiver<Ah> runs WlanSync > WlanSyncLong > WlanEqualizer >
# WlanDecoder inside itself (the blocks of wlan_simple.toml). Same frames;
# replacing it is replacing one block.
name = "halow"

[blocks.rx]
type = "WlanReceiver<Ah>"

[inputs]
samples = { port = "rx.input", type = "c32" }

[message_outputs]
frames = "rx.rx_frames"

# S1G channel 34 (EU), 2 MHz, as the dyn branch's real-device runs.
[radio]
frequency = 919.0e6
