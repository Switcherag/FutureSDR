# 802.11ah RX "A" — 4 MSps direct staged pipeline (halow_swap A/B pair).
#
# Copy of wlan_ah_rx_v2.toml differing ONLY in the controller-tap name, the
# mirror of the zigbee_rxA/rxB pair. Both sit on the same center frequency, so
# a swap's retune is skipped ("params already current") and the swap never
# waits on the hardware — change frequency_hz here to put the radio back in
# the loop.
#
# The `to = "tail"` port below is wired to `null_tail.toml` by halow_swap, so
# the tail exists structurally but discards.
#
# This mirrors examples/wlan_ah/src/bin/rx_debugv2.rs:
#   head@4 Msps -> StfDetector -> CfoCorrector -> StoCorrector ->
#   ChannelEstimator -> SigDecoder -> DataDemod -> Decoder
#
# Unlike wlan_ah_rx.toml, there is no local 2:1 resampler. The radio head
# stays at 4 Msps and the v2 blocks operate directly at that rate.

[radio]
frequency_hz   = 919.0e6
sample_rate_hz = 4e6
gain_db        = 10.0

[[ports]]
id = "in"
direction = "in"
dst = "stf.input"
type = "c32"
from = "head"

# Output to the network tail FG (length-prefixed u8 stream).
[[ports]]
id = "frames"
direction = "out"
src = "to_tail.output"
type = "u8"
to = "tail"

[[blocks]]
id = "stf"
plugin = "wlan_ah_v2_stf_detector_plugin"
# Largest PSDU (bytes) this receiver expects. The detector buffers one whole
# frame length before it can emit, so this is also its cold-start latency —
# what a rebuilt flowgraph waits through on every swap. 128 B covers every
# frame seen on this link (99 B max) at ~1.9 ms, versus ~19 ms for the
# 1500 B PHY maximum. Frames longer than this are not captured.
config = 128
config_type = "usize"

[[blocks]]
id = "cfo"
plugin = "wlan_ah_v2_cfo_corrector_plugin"

[[blocks]]
id = "sto"
plugin = "wlan_ah_v2_sto_corrector_plugin"

[[blocks]]
id = "ch"
plugin = "wlan_ah_v2_channel_estimator_plugin"
config = false
config_type = "bool"

[[blocks]]
id = "sig"
plugin = "wlan_ah_v2_sig_decoder_plugin"
config = false
config_type = "bool"

[[blocks]]
id = "data"
plugin = "wlan_ah_v2_data_demod_plugin"
config = false
config_type = "bool"

[[blocks]]
id = "decoder"
plugin = "wlan_ah_decoder_plugin"

[[blocks]]
id = "udp_rx"
plugin = "blob_to_udp_plugin"
config = "127.0.0.1:55555"

# Forward each RFtap-encapsulated frame to the network tail FG as a
# length-prefixed byte stream. The tail owns the UDP/RFtap egress + TAP NIC
# distribution so all PHYs share one set of network blocks instead of each
# duplicating their own udp sink.
[[blocks]]
id = "to_tail"
plugin = "blob_to_lp_stream_plugin"

[[connections]]
src = "stf.frame"
dst = "cfo.frame"
message = true

[[connections]]
src = "cfo.frame"
dst = "sto.frame"
message = true

[[connections]]
src = "sto.frame"
dst = "ch.frame"
message = true

[[connections]]
src = "ch.frame"
dst = "sig.frame"
message = true

[[connections]]
src = "sig.frame"
dst = "data.frame"
message = true

[[connections]]
src = "data.output"
dst = "decoder.input"

[[connections]]
src = "decoder.rx_frames"
dst = "udp_rx.in"
message = true

# RFtap-encapsulated frames → network tail (via length-prefixed u8 bridge).
# The 12-byte RFtap header (magic "RFta" + flags + DLT 105 for IEEE 802.11)
# is what the tail's downstream blocks consume.
[[connections]]
src = "decoder.rftap"
dst = "to_tail.rx"
message = true

[[controller_taps]]
src = "decoder.rx_frames"
name = "halow_frames_a"
