# 802.11ah (HaLow, S1G 2 MHz at 4 MSps) receiver: the wlan plugin's `Ah`
# standard (the dyn branch's v6). Posts the frames it decodes on `frames`.
name = "halow"
connections = "sync > long > eq > dec"

[blocks.sync]
type = "WlanSync<Ah>"

[blocks.long]
type = "WlanSyncLong<Ah>"

[blocks.eq]
type = "WlanEqualizer<Ah>"

[blocks.dec]
type = "WlanDecoder<Ah>"

[inputs]
samples = { port = "sync.input", type = "c32" }

[message_outputs]
frames = "dec.rx_frames"

# S1G channel 34 (EU), 2 MHz, as the dyn branch's real-device runs.
[radio]
frequency = 919.0e6
