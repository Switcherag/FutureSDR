# HaLow receiver (802.11ah, S1G 2 MHz at 4 MSps) as four blocks,
# sync > long > eq > dec, as wlan_simple.toml builds it.
#
# The data symbols are Viterbi decoded (WlanDecoder / WlanReceiver, which
# carry the Viterbi decoder alone).
#
# The radio bench swaps it with halow_simple_hard_inplace.toml
# after every frame: only the decoder is replaced, in place: it runs as a
# flowgraph of its own (`swappable`), the rest keeps running.
#
# The frames whose FCS is wrong are posted too, whole (`invalid_frames`):
# the radio bench's transmitter sends minimum-size frames with no
# payload, so there is no FCS here to check.
name = "halow/simple/viterbi"
connections = "sync > long > eq > dec"

[blocks.sync]
type = "WlanSync<Ah>"

[blocks.long]
type = "WlanSyncLong<Ah>"

[blocks.eq]
type = "WlanEqualizer<Ah>"

[blocks.dec]
type = "WlanDecoder<Ah>"
invalid_frames = true

# The decoding runs apart, so that a replacement replaces that block
# alone; its input's item type cannot be told from its type.
[swappable]
dec = { input = "u8" }

[inputs]
samples = { port = "sync.input", type = "c32" }

[message_outputs]
frames = "dec.rx_frames"

# S1G channel 34 (EU), 2 MHz, as the dyn branch's real-device runs.
[radio]
frequency = 919.0e6
