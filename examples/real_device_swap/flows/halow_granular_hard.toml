# HaLow receiver (802.11ah, S1G 2 MHz at 4 MSps) block by block, as
# examples/wlan builds its receiver (13 blocks), as wlan_granular.toml.
#
# The convolutional code is undone by its inverse instead of Viterbi
# decoding (WlanHardDecoder / WlanHardReceiver, which carry the inverse
# alone): no error correction, rate 1/2 only.
#
# The radio bench swaps it with halow_granular_viterbi.toml
# after every frame: the whole flowgraph is replaced at each swap.
#
# The frames whose FCS is wrong are posted too, whole (`invalid_frames`):
# the radio bench's transmitter sends minimum-size frames with no
# payload, so there is no FCS here to check.
name = "halow/granular/hard"
connections = """
in > delay
in > mag > power
in > in0.mult
delay > in1.mult
mult > corr
corr > in0.div
power > in1.div
delay > in_sig.sync
corr > in_abs.sync
div > in_cor.sync
sync > long > fft > eq > dec
"""

# The flowgraph's input, fanned out to the three branches.
[blocks.in]
type = "Copy<Complex32>"

# The short training field's period: FFT_SIZE / 4.
[blocks.delay]
type = "Delay<Complex32>"
n = 32

[blocks.mag]
type = "WlanMagSquared"

[blocks.mult]
type = "WlanMultiplyConj"

# Power over one symbol without cyclic prefix, FFT_SIZE samples.
[blocks.power]
type = "WlanMovingSum<f64>"
len = 128

# Autocorrelation over three STF periods.
[blocks.corr]
type = "WlanMovingSum<Complex64>"
len = 96

[blocks.div]
type = "WlanDivideMag"

[blocks.sync]
type = "WlanSyncShort<Ah>"

[blocks.long]
type = "WlanSyncLong<Ah>"

[blocks.fft]
type = "WlanFft<Ah>"

[blocks.eq]
type = "WlanFrameEqualizer<Ah>"

[blocks.dec]
type = "WlanHardDecoder<Ah>"
invalid_frames = true

[inputs]
samples = { port = "in.input", type = "c32" }

[message_outputs]
frames = "dec.rx_frames"

# S1G channel 34 (EU), 2 MHz, as the dyn branch's real-device runs.
[radio]
frequency = 919.0e6
