[package]
name = "freq_swap"
version = "0.1.0"
edition = "2024"

[workspace]
# The vendored NBFM demo is standalone and unreferenced; seify-bladerf is a
# path dependency and joins as a member.
exclude = ["bladerfbindings/BladeRF-NBFM-Tranciever-Rust-Example"]

[lib]
crate-type = ["dylib", "rlib"]

[[bin]]
name = "cpu"

[[bin]]
name = "freq_swap"

[[bin]]
name = "freq_swap_reconfigure_streaming"

[[bin]]
name = "freq_sine_tx"

[[bin]]
name = "freq_recorder"

[[bin]]
name = "bw_recorder"

[[bin]]
name = "retune_timing"

# Times every Zigbee <-> 802.11ah US channel-to-channel retune into a square
# matrix, with and without a concurrent RX stream.
[[bin]]
name = "retune_matrix"

# Same matrix, same CSV schema, but straight to libbladeRF instead of through
# SoapySDR — so the two runs can be overlaid to see how much of the retune cost
# is the abstraction layer. Also exposes the Host/FPGA tuning-mode switch,
# which SoapySDR gives no way to reach.
[[bin]]
name = "retune_matrix_brf"

# Measures what quick tune costs *on the air* rather than what the call costs:
# transmits a tone on TX2, records it on RX1, and swaps both ends at a scheduled
# sample timestamp so the outage can be read straight out of the IQ.
[[bin]]
name = "quicktune_swap_iq"

# Answers "can this board do quick tune, and how fast": times set_frequency
# vs schedule_retune vs a recalled quick-tune profile, side by side.
[[bin]]
name = "quick_tune_probe"

[[bin]]
name = "vulkan"
required-features = ["vulkan"]

[features]
default = []
vulkan = ["futuresdr/vulkan", "vulkano", "vulkano-shaders"]
wgpu = ["futuresdr/wgpu"]

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
futuresdr = { path = "../..", features = ["soapy"] }
# Direct libbladeRF bindings (git submodule), used only by retune_matrix_brf.
# Needs libbladeRF headers at build time: BLADERF_INCLUDE_PATH=/usr/local/include
bladerf = { path = "bladerfbindings/seify-bladerf" }
vulkano = { version = "0.35", optional = true }
vulkano-shaders = { version = "0.35", optional = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
gloo-net = "0.6"
log = "0.4"
leptos = { version = "0.8", features = ["csr", "nightly"] }
prophecy = { path = "../../crates/prophecy" }
serde_json = "1.0"
